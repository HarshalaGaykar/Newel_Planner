<!DOCTYPE html>
<html>
<head>
    <style>
        body { font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; color: #333; line-height: 1.6; }
        .container { max-width: 600px; margin: 20px auto; padding: 20px; border: 1px solid #eee; border-radius: 10px; }
        .header { border-bottom: 2px solid #6366f1; padding-bottom: 10px; margin-bottom: 20px; }
        .footer { font-size: 12px; color: #777; margin-top: 30px; border-top: 1px solid #eee; padding-top: 10px; }
        .btn { display: inline-block; padding: 10px 20px; background-color: #6366f1; color: white; text-decoration: none; border-radius: 5px; margin-top: 20px; }
    </style>
</head>
<body>
    <div class="container">
        <div class="header">
            <h2>Newel Planner</h2>
        </div>
        <p>Hello {{name}},</p>
        <p>This is a reminder that you have not submitted your timesheet for the week <strong>{{weekLabel}}</strong>.</p>
        <p>Please log in and submit your hours at your earliest convenience to avoid any delays in reporting.</p>
        <a href="{{link}}" class="btn">Submit Timesheet</a>
        <div class="footer">
            <p>This is an automated notification from Newel Planner.</p>
        </div>
    </div>
</body>
</html>
