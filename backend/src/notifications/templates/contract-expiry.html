<!DOCTYPE html>
<html>
<head>
    <style>
        body { font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; color: #333; line-height: 1.6; }
        .container { max-width: 600px; margin: 20px auto; padding: 20px; border: 1px solid #eee; border-radius: 10px; }
        .header { border-bottom: 2px solid #ef4444; padding-bottom: 10px; margin-bottom: 20px; }
        .footer { font-size: 12px; color: #777; margin-top: 30px; border-top: 1px solid #eee; padding-top: 10px; }
    </style>
</head>
<body>
    <div class="container">
        <div class="header">
            <h2 style="color: #ef4444;">Contract Expiry Alert</h2>
        </div>
        <p>This is to notify you that the contract for <strong>{{freelancerName}}</strong> is set to expire in <strong>{{daysLeft}} days</strong>.</p>
        <p><strong>Expiry Date:</strong> {{contractEnd}}</p>
        <p>Please take the necessary actions for renewal or offboarding.</p>
        <div class="footer">
            <p>This is an automated notification from Newel Planner.</p>
        </div>
    </div>
</body>
</html>
